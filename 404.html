<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">

    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px;
            position: relative;
            overflow: hidden;
            background: #0a1a14;
        }

        .error-content {
            max-width: 680px;
            width: 100%;
            z-index: 2;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 4. Perfectly horizontally centered website logo */
        .error-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            width: 100%;
            text-align: center;
        }

        .error-logo a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .error-logo a:hover {
            transform: scale(1.05);
        }

        .error-logo img {
            height: 48px;
            max-height: 52px;
            width: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .error-icon {
            font-size: 64px;
            color: #14b8a6;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .error-code {
            font-size: 160px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(90deg, #059669 0%, #14b8a6 50%, #f43f5e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            animation: glow 4s linear infinite;
            letter-spacing: -2px;
            user-select: none;
        }

        @keyframes glow {
            0% {
                filter: drop-shadow(0 0 15px rgba(5, 150, 105, 0.4));
            }
            50% {
                filter: drop-shadow(0 0 30px rgba(20, 184, 166, 0.6));
            }
            100% {
                filter: drop-shadow(0 0 15px rgba(244, 63, 94, 0.4));
            }
        }

        .error-title {
            font-size: 42px;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 15px;
            line-height: 1.2;
        }

        .error-text {
            font-size: 17px;
            color: var(--muted, #7a9a8a);
            margin: 0 auto 35px;
            max-width: 520px;
            line-height: 1.6;
        }

        /* Error action buttons */
        .error-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            width: 100%;
        }

        .error-actions .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .error-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(5, 150, 105, 0.4);
        }

        .error-actions .btn-outline {
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #ffffff;
            padding: 14px 30px;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            outline: none;
        }

        .error-actions .btn-outline:hover {
            background: rgba(20, 184, 166, 0.15);
            border-color: #14b8a6;
            color: #14b8a6;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.25);
        }

        .error-timer-box {
            margin-top: 35px;
            color: #7a9a8a;
            font-size: 14px;
        }

        /* Ambient Glowing Circles */
        .error-bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.22;
            z-index: 1;
            pointer-events: none;
        }

        .circle-1 {
            width: 380px;
            height: 380px;
            background: #059669;
            top: -120px;
            left: -120px;
        }

        .circle-2 {
            width: 440px;
            height: 440px;
            background: #14b8a6;
            bottom: -160px;
            right: -160px;
        }

        .circle-3 {
            width: 280px;
            height: 280px;
            background: #f43f5e;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .error-code {
                font-size: 110px;
            }
            .error-title {
                font-size: 32px;
            }
            .error-text {
                font-size: 15px;
                margin-bottom: 28px;
            }
            .error-logo img {
                height: 42px;
            }
            .error-icon {
                font-size: 52px;
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 85px;
            }
            .error-title {
                font-size: 24px;
            }
            .error-actions {
                flex-direction: column;
                gap: 12px;
            }
            .error-actions .btn-primary,
            .error-actions .btn-outline {
                width: 100%;
            }
            .error-logo img {
                height: 36px;
            }
        }
    </style>
</head>

<body>

    <!-- Ambient Glow Background Effects -->
    <div class="error-bg-circle circle-1"></div>
    <div class="error-bg-circle circle-2"></div>
    <div class="error-bg-circle circle-3"></div>

    <section class="error-page">
        <div class="error-content">

            <!-- 4. Perfectly horizontally centered website logo -->
            <div class="error-logo">
                <a href="index.html" title="Stackly AI Home">
                    <img src="logo.webp" alt="Stackly AI">
                </a>
            </div>

            <!-- 5. Proper Spacing: Icon, Code, Heading, Description -->
            <div class="error-icon">
                <i class="fas fa-robot"></i>
            </div>

            <div class="error-code">
                404
            </div>

            <h1 class="error-title">
                Oops! Page Not Found
            </h1>

            <p class="error-text">
                The page you're looking for doesn't exist, has been moved, or is currently unavailable.
            </p>

            <!-- 1, 2, 3. Buttons: Back to Home & Functional Go Back button (history.back()) -->
            <div class="error-actions">
                <a href="index.html" class="btn-primary">
                    <i class="fas fa-home"></i> Back To Home
                </a>

                <button type="button" class="btn-outline" id="goBackBtn" onclick="handleGoBack();">
                    <i class="fas fa-arrow-left"></i> Go Back
                </button>
            </div>

            <!-- Auto Redirect Timer -->
            <div class="error-timer-box">
                Redirecting to Home Page in <span id="countdown" style="color:#14b8a6;font-weight:700;">10</span> seconds...
            </div>

        </div>
    </section>

    <script src="assets/js/main.js"></script>
    <!-- GSAP & ScrollTrigger Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="assets/js/animations.js"></script>
    <script>
        /* ==========================
           3. GO BACK BUTTON (history.back())
        ========================== */
        function handleGoBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "index.html";
            }
        }

        /* ==========================
           AUTO REDIRECT COUNTDOWN
        ========================== */
        let timeLeft = 10;
        const countdown = document.getElementById("countdown");

        const timer = setInterval(() => {
            timeLeft--;
            if (countdown) {
                countdown.textContent = timeLeft;
            }

            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = "index.html";
            }
        }, 1000);
    </script>

</body>

</html>
